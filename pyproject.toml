[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "volume"
version = "1.1.3"
description = "Rectangular prism volume calculator with Pint-based unit support."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
keywords = ["physics", "units", "pint", "geometry", "volume"]
authors = [
    {name = "Michał", email = "bravoquite@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["pint>=0.24"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/bravoquite/RSE_lec_MK.git"
Documentation = "https://bravoquite.github.io/RSE_lec_MK/volume.html"

[tool.setuptools]
py-modules = ["volume"]